<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lector MRZ - Cédula Chilena</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192536;--line:#2d4058;--accent:#39c6a4;--muted:#a9b8ca}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f3f6fa;font:14px/1.4 system-ui,Segoe UI,Arial;overflow-x:hidden}
main{max-width:800px;margin:auto;padding:12px}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:1.2rem;margin:0}

.layout{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
h2{font-size:0.95rem;margin:0 0 8px}

.viewer{
  position:relative;
  background:#05080d;
  border-radius:10px;
  overflow:hidden;
  aspect-ratio:16/9;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  width:100%;
}
.viewer:active{outline:2px solid var(--accent)}
video{width:100%;height:100%;object-fit:cover;display:block}

.overlay{position:absolute;left:5%;top:58%;width:90%;height:36%;border:2px solid var(--accent);border-radius:7px;box-shadow:0 0 0 999px #0005;pointer-events:none}
.overlay:before{content:"TOCA PARA ESCANEAR MRZ";position:absolute;top:-24px;left:0;background:var(--accent);color:#06231c;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,select,input{border:0;border-radius:7px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;background:var(--accent);color:#06231c}
button.secondary{background:#34465e;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
select{background:#101a28;color:#fff;border:1px solid var(--line);width:100%}

.status{color:var(--accent);font-size:12px;margin-top:8px;min-height:18px;font-weight:600}
.result{display:grid;gap:8px}
.field{background:#101a28;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field label,.small-label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

/* Inputs editables para corregir datos capturados */
.editable-input{
  width:100%;
  background:transparent;
  border:none;
  color:#fff;
  font-size:1rem;
  font-weight:650;
  outline:none;
  padding:2px 0;
}
.editable-input:focus{
  border-bottom:1px solid var(--accent);
}

.copyrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.copyrow button{padding:4px 8px;font-size:11px}
textarea{width:100%;margin-top:4px;background:#101a28;color:white;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:11px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:99;justify-content:center;align-items:center;padding:16px}
.modal.open{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:500px;width:100%}
.modal-content input{width:100%;background:#101a28;color:#fff;border:1px solid var(--line);padding:8px;margin-top:4px}

@media (orientation: landscape) {
  main{max-width:700px;padding:8px}
  .viewer{aspect-ratio:21/9;max-height:50vh;}
}
</style>
</head>
<body>
<main>
  <div class="header-row">
    <h1>Lector MRZ · Cédula Chilena</h1>
    <button id="openSettings" class="secondary">⚙️ Settings</button>
  </div>

  <div class="layout">
    <section class="panel">
      <h2>1. Visor de Cámara</h2>
      <div class="viewer" id="viewer" title="Toca la pantalla para tomar lectura">
        <video id="video" autoplay muted playsinline></video>
        <div class="overlay"></div>
      </div>
      <div class="controls">
        <select id="cameraSelect" aria-label="Seleccionar cámara"><option value="">Cámara Trasera (Auto)</option></select>
        <button id="startCamera">Activar Cámara</button>
        <button id="stopCamera" class="secondary" disabled>Detener</button>
      </div>
      <div id="status" class="status">Listo. Activa la cámara o toca el visor.</div>
    </section>

    <section class="panel">
      <h2>2. Datos Capturados (Editables)</h2>
      <div class="result">
        <div class="field">
          <label>RUT</label>
          <div class="copyrow">
            <input type="text" id="rut" class="editable-input" value="—" placeholder="Ej: 12345678-K">
            <button onclick="copyField('rut')">Copiar</button>
          </div>
        </div>
        <div class="field">
          <label>Apellidos</label>
          <div class="copyrow">
            <input type="text" id="surnames" class="editable-input" value="—" placeholder="Apellidos">
            <button onclick="copyField('surnames')">Copiar</button>
          </div>
        </div>
        <div class="field">
          <label>Nombres</label>
          <div class="copyrow">
            <input type="text" id="names" class="editable-input" value="—" placeholder="Nombres">
            <button onclick="copyField('names')">Copiar</button>
          </div>
        </div>
      </div>
      <div class="controls" style="margin-top:10px">
        <button id="sendSheetsBtn" class="secondary" style="width:100%">📊 Enviar a Google Sheets</button>
      </div>
      <div style="margin-top:10px">
        <label class="small-label" for="raw">Texto OCR detectado</label>
        <textarea id="raw" rows="2" placeholder="Líneas MRZ detectadas..."></textarea>
      </div>
    </section>
  </div>
</main>

<div id="modalSettings" class="modal">
  <div class="modal-content">
    <h2>⚙️ Configuración de Google Sheets</h2>
    <p style="font-size:12px;color:var(--muted)">Pega la URL de tu Google Apps Script Web App:</p>
    <div style="margin-bottom:12px">
      <label class="small-label">URL del Web App Script:</label>
      <input type="text" id="sheetsUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="controls">
      <button id="saveSettings">Guardar</button>
      <button id="closeSettings" class="secondary">Cerrar</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const viewer = document.getElementById('viewer');
const cameraSelect = document.getElementById('cameraSelect');
const statusEl = document.getElementById('status');
const rawEl = document.getElementById('raw');

let stream = null, worker = null, busy = false;

function setStatus(s) { statusEl.textContent = s; }

function cleanLine(s) {
  return s.toUpperCase().replace(/[\/\|\\\[\]\{\}]/g, '<').replace(/[^A-Z0-9<]/g, '');
}

function parseMRZ(rawText) {
  if (!rawText || !rawText.trim()) return;

  const rawLines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const lines = rawLines.map(cleanLine);

  let rut = '—', surnames = '—', names = '—';

  let line2 = lines.find(l => l.includes('CHL')) || '';
  if (!line2) {
    const fullText = lines.join('');
    if (fullText.includes('CHL')) line2 = fullText.slice(fullText.indexOf('CHL'));
  }

  if (line2) {
    const matchRut = line2.match(/CHL.*?([0-9]{7,8})<+([0-9K])/i);
    if (matchRut) {
      rut = `${matchRut[1]}-${matchRut[2]}`;
    } else {
      const chlIndex = line2.indexOf('CHL');
      if (chlIndex !== -1) {
        const sub = line2.slice(chlIndex + 3);
        const altMatch = sub.match(/([0-9]{7,8})<+([0-9K])/i);
        if (altMatch) rut = `${altMatch[1]}-${altMatch[2]}`;
      }
    }
  }

  let line3 = lines.find(l => !l.includes('INCHL') && !l.includes('CHL') && /[A-Z]{3,}/.test(l)) || '';
  if (!line3 && lines.length >= 3) line3 = lines[2];
  else if (!line3 && lines.length > 0) line3 = lines[lines.length - 1];

  if (line3) {
    const normalized = line3.replace(/<[IL1_~]/g, '<<');
    const splitIdx = normalized.indexOf('<<');

    if (splitIdx !== -1) {
      surnames = normalized.slice(0, splitIdx).replace(/</g, ' ').replace(/\s+/g, ' ').trim() || '—';
      names = normalized.slice(splitIdx + 2).replace(/</g, ' ').replace(/\s+/g, ' ').trim() || '—';
    } else {
      const parts = line3.split('<').filter(p => p.length > 0);
      if (parts.length >= 2) {
        surnames = parts[0].trim();
        names = parts.slice(1).join(' ').trim();
      }
    }
  }

  document.getElementById('rut').value = rut;
  document.getElementById('surnames').value = surnames;
  document.getElementById('names').value = names;

  if (rut === '—' && surnames === '—' && names === '—') {
    setStatus('⚠️ No se reconocieron datos claros. Puedes escribirlos manualmente.');
  } else {
    setStatus('✅ Lectura completada. Puedes corregir los campos y enviar.');
  }
}

async function refreshCameras(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    const previous = cameraSelect.value;
    cameraSelect.innerHTML = '<option value="">Cámara Trasera (Auto)</option>';
    cams.forEach((c, i) => {
      const o = document.createElement('option');
      o.value = c.deviceId;
      o.textContent = c.label || `Cámara ${i+1}`;
      cameraSelect.appendChild(o);
    });
    if (previous && cams.some(c => c.deviceId === previous)) cameraSelect.value = previous;
  }catch(e){ console.error(e); }
}

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){ setStatus('Error: Sin acceso a cámara.'); return; }
  stopCamera();
  setStatus('Activando cámara...');

  const id = cameraSelect.value;
  let constraints = id ? { audio: false, video: { deviceId: { exact: id } } }
                       : { audio: false, video: { facingMode: { ideal: 'environment' } } };

  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err1) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
    } catch (err2) {
      setStatus('Error activando cámara. Revisa permisos.');
      return;
    }
  }

  video.srcObject = stream;
  await video.play().catch(e=>console.error(e));
  await refreshCameras();
  document.getElementById('stopCamera').disabled = false;
  setStatus('Cámara lista. Toca la pantalla para capturar.');
}

function stopCamera(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  document.getElementById('stopCamera').disabled = true;
  setStatus('Cámara detenida.');
}

async function getWorker(){
  if(!worker){
    setStatus('Cargando OCR...');
    worker = await Tesseract.createWorker('eng', 1);
    await worker.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',
      preserve_interword_spaces: '1',
      tessedit_pageseg_mode: '6'
    });
  }
  return worker;
}

async function readFrame(){
  if(!stream || video.readyState < 2 || busy) return;
  busy = true;
  setStatus('Procesando imagen...');
  try{
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const sx = Math.round(vw * 0.05), sy = Math.round(vh * 0.58), sw = Math.round(vw * 0.90), sh = Math.round(vh * 0.36);

    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = sw * scale;
    canvas.height = sh * scale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
      const bw = v < 120 ? 0 : 255;
      data[i] = bw; data[i + 1] = bw; data[i + 2] = bw;
    }
    ctx.putImageData(imgData, 0, 0);

    const w = await getWorker();
    const result = await w.recognize(canvas);
    const txt = result.data.text || '';

    if(txt.trim()){
      rawEl.value = txt;
      parseMRZ(txt);
    } else {
      setStatus('No se detectó texto. Reintenta.');
    }
  }catch(e){
    setStatus('Error OCR: ' + e.message);
  }finally{
    busy = false;
  }
}

viewer.addEventListener('click', () => { if (stream && !busy) readFrame(); });
document.getElementById('startCamera').onclick = startCamera;
document.getElementById('stopCamera').onclick = stopCamera;
cameraSelect.onchange = () => { if(stream) startCamera(); };

function copyField(id){
  const t = document.getElementById(id).value;
  if(t && t !== '—') {
    navigator.clipboard.writeText(t);
    setStatus('Copiado al portapapeles.');
  }
}

const modal = document.getElementById('modalSettings');
document.getElementById('openSettings').onclick = () => {
  document.getElementById('sheetsUrlInput').value = localStorage.getItem('sheets_web_app_url') || '';
  modal.classList.add('open');
};
document.getElementById('closeSettings').onclick = () => modal.classList.remove('open');
document.getElementById('saveSettings').onclick = () => {
  const url = document.getElementById('sheetsUrlInput').value.trim();
  localStorage.setItem('sheets_web_app_url', url);
  modal.classList.remove('open');
  setStatus('URL de Google Sheets guardada.');
};

async function sendToGoogleSheets(rut, surnames, names) {
  const baseUrl = localStorage.getItem('sheets_web_app_url');
  if(!baseUrl) {
    setStatus('⚠️ Configura primero la URL en Settings.');
    return;
  }

  if (!rut || rut === '—') {
    setStatus('⚠️ Ingresa un RUT válido antes de enviar.');
    return;
  }

  setStatus('Enviando a Google Sheets...');
  try {
    const timestamp = encodeURIComponent(new Date().toLocaleString());
    const encodedRut = encodeURIComponent(rut);
    const encodedSurnames = encodeURIComponent(surnames);
    const encodedNames = encodeURIComponent(names);

    const fullUrl = `${baseUrl}?timestamp=${timestamp}&rut=${encodedRut}&surnames=${encodedSurnames}&names=${encodedNames}`;

    await fetch(fullUrl, { method: 'GET', mode: 'no-cors' });
    
    setStatus('✅ Datos guardados con éxito en Google Sheets.');
  } catch(e) {
    setStatus('⚠️ Error al enviar a Sheets.');
    console.error(e);
  }
}

document.getElementById('sendSheetsBtn').onclick = () => {
  const rut = document.getElementById('rut').value.trim();
  const surnames = document.getElementById('surnames').value.trim();
  const names = document.getElementById('names').value.trim();
  sendToGoogleSheets(rut, surnames, names);
};

window.addEventListener('beforeunload', () => { if(stream) stream.getTracks().forEach(t => t.stop()); });
</script>
</body>
</html>
